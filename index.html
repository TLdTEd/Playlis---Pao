<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1 class="welcome-title">22</h1>
            <p class="welcome-subtitle">Tus 22 años en canciones ✨</p>
            <button class="btn-open" onclick="startExperience()">Escuchar regalo</button>
        </div>
    </div>

    <main id="main-content">
        <div class="player-card">
            <div class="photo-container">
                <img id="song-img" src="" alt="Momento">
            </div>
            <div class="info-container">
                <div class="song-title" id="song-title">Cargando...</div>
                <div class="lyrics-box" id="song-lyrics">Cargando letras...</div>
            </div>
            <div class="controls-box">
                <select id="song-select" class="modern-select" onchange="changeSong(this.value)"></select>
                <div class="nav-buttons">
                    <button class="btn-nav" onclick="navigate(-1)">Anterior</button>
                    <button class="btn-nav" onclick="navigate(1)">Siguiente</button>
                </div>
            </div>
        </div>

        <div class="spotify-container">
            <iframe style="border-radius:12px" src="https://spotify.com" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </main>

    <script>
        const playlistData = [
            { title: "Sanctuary - Joji", lyrics: "Not anyone, you're the one\nMore than fun, you're the sanctuary\n\nNo cualquiera, eres tú.\nMás que diversión, eres el refugio.", photo: "https://unsplash.com" },
            { title: "Baile inolvidable - Bad Bunny", lyrics: "Mientras uno esté vivo\nuno debe amar lo más que pueda.", photo: "https://unsplash.com" },
            { title: "White ferrari - Frank Ocean", lyrics: "I care for you still, and I will forever\n\nTodavía me importas, y lo haré para siempre.", photo: "https://unsplash.com" },
            { title: "El tesoro - El mató a un policía", lyrics: "Voy a quedarme un poco acá\nCuidarte siempre a vos en la derrota\nHasta el final, el final.", photo: "https://unsplash.com" },
            { title: "Quiéreme - Latin Mafia", lyrics: "Puede que no sepa bailar\nY aún así me quedo por ti.", photo: "https://unsplash.com" },
            { title: "Te estoy correteando - Latin Mafia", lyrics: "Cuéntame, ¿qué ha sido de ti?\nExtráñame, te extraño a ti.", photo: "https://unsplash.com" },
            { title: "Godspeed - Frank Ocean", lyrics: "Still, I'll always be there for you\n\nAun así, siempre estaré ahí para ti.", photo: "https://unsplash.com" },
            { title: "Neo roneo - Rusowsky", lyrics: "Quererte hasta que duela\nTodo este corazón caliente.", photo: "https://unsplash.com" },
            { title: "Otro atardecer - Bad Bunny", lyrics: "No sé qué sucedió pero\nme perdí en tu mirada.", photo: "https://unsplash.com" },
            { title: "BBY ROMEO - Rusowsky", lyrics: "Y es que yo no sé lo que tiene\nPero mira cómo me tiene.", photo: "https://unsplash.com" },
            { title: "Si en tu mente estuve - Nsqk", lyrics: "Cuéntame siquiera si pensaste en lo mismo de siempre.", photo: "https://unsplash.com" },
            { title: "Yo no soy celoso - Bad Bunny", lyrics: "Tranquila, no soy psycho\nNo vo'a hacer un papelón.", photo: "https://unsplash.com" },
            { title: "Vivo si me exiges - Latin Mafia", lyrics: "¿Qué he dejado en ti? Me pregunto\nEs que tú me lo has dado todo.", photo: "https://unsplash.com" },
            { title: "Continuo atardecer - Latin Mafia", lyrics: "Sus cicatrices se volvieron lienzos\nEn cada herida se dio un beso.", photo: "https://unsplash.com" },
            { title: "Chinita linda - Alvaro Diaz", lyrics: "Dime a ver, chinita linda.", photo: "https://unsplash.com" },
            { title: "Miau - Young Cister", lyrics: "Con esa mirá' que mata como pistola.", photo: "https://unsplash.com" },
            { title: "Te lo prometo - Humbe", lyrics: "Volver a abrazarte hasta llorar\nY nunca más volver a soltarte.", photo: "https://unsplash.com" },
            { title: "YOKO - Alvaro Diaz", lyrics: "Si tú me quisiste cuando ni yo me quería.", photo: "https://unsplash.com" },
            { title: "2:12AM - Rauw Alejandro", lyrics: "Un mundo perfecto, inventémoslo\nY ven y bésame la boca.", photo: "https://unsplash.com" },
            { title: "Patadas de ahogado - Latin Mafia", lyrics: "Y que siempre voy a querer saber\nsi va bien todo en tu día.", photo: "https://unsplash.com" },
            { title: "Se fue la luz - Latin Mafia", lyrics: "Y me está cantando canciones en el pecho.", photo: "https://unsplash.com" },
            { title: "ESCENCIA - Humbe", lyrics: "Porque perderte es vivir sin mi propia esencia.", photo: "https://unsplash.com" }
        ];

        let currentIndex = 0;
        const selectElement = document.getElementById('song-select');
        playlistData.forEach((song, idx) => {
            let option = document.createElement('option'); option.value = idx; option.textContent = song.title; selectElement.appendChild(option);
        });

        function updateSongDisplay(index) {
            currentIndex = index; const song = playlistData[index];
            document.getElementById('song-title').textContent = song.title;
            document.getElementById('song-lyrics').textContent = song.lyrics;
            document.getElementById('song-img').src = song.photo;
            document.getElementById('song-select').value = index;
        }
        function changeSong(index) { updateSongDisplay(parseInt(index)); }
        function navigate(direction) { let newIndex = currentIndex + direction; if (newIndex >= 0 && newIndex < playlistData.length) { updateSongDisplay(newIndex); } }
        function startExperience() { document.getElementById('welcome-screen').classList.add('hidden'); initConfetti(); }

        const canvas = document.getElementById('confetti-canvas'); const ctx = canvas.getContext('2d'); let confetti = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function initConfetti() {
            const colors = ['#1DB954', '#FFFFFF', '#535353', '#212121'];
            for (let i = 0; i < 60; i++) {
                confetti.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height, r: Math.random() * 4 + 2, d: Math.random() * canvas.height, color: colors[Math.floor(Math.random() * colors.length)], tilt: Math.random() * 10 - 5, tiltAngleIncremental: Math.random() * 0.05, tiltAngle: 0 });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); let active = false;
            confetti.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleIncremental; p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2; p.x += Math.sin(p.tiltAngle); p.tilt = Math.sin(p.tiltAngle - index / 3) * 10;
                if (p.y <= canvas.height) { active = true; }
                ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x + p.tilt + p.r / 2, p.y); ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2); ctx.stroke();
            });
            if (active) { requestAnimationFrame(animateConfetti); } else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        }
        updateSongDisplay(0);
    </script>
</body>
</html>
