<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 ✨</title>
    <!-- Tipografías Estilo Garabato e Ilustración de Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-cream: #FDFBF7; /* Fondo papel de ilustración */
            --accent-woodstock: #FFDE4D; /* Amarillo Woodstock suave */
            --accent-snoopy: #FF6B6B; /* Rojo tierno */
            --text-dark: #1A1A1A;
            --box-bg: #FFFFFF;
            --hand-border: 3px solid #1A1A1A;
            --doodle-shadow: 5px 5px 0px #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 10px;
        }

        /* --- BIENVENIDA DOODLE POÉTIQUE --- */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-cream);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.6s ease, visibility 0.6s; padding: 20px;
        }

        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .welcome-card {
            background: var(--box-bg);
            padding: 40px 25px;
            border: var(--hand-border);
            border-radius: 20px;
            box-shadow: var(--doodle-shadow);
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* Decoración de estrellas dibujadas en las esquinas */
        .welcome-card::before { content: '✨'; position: absolute; top: 15px; left: 15px; font-size: 20px; }
        .welcome-card::after { content: '🐾'; position: absolute; bottom: 15px; right: 15px; font-size: 20px; }

        .welcome-poem {
            font-family: 'Patrick Hand', cursive;
            font-size: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            margin-bottom: 25px;
            white-space: pre-line;
        }

        .welcome-birthday {
            font-size: 20px;
            font-weight: 600;
            background-color: var(--accent-woodstock);
            padding: 6px 15px;
            border: var(--hand-border);
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 30px;
            transform: rotate(-1deg);
        }

        .btn-open {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--accent-snoopy);
            color: white;
            border: var(--hand-border);
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #1A1A1A;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }

        .btn-open:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px #1A1A1A;
        }

        /* --- REPRODUCTOR PRINCIPAL --- */
        #main-content {
            max-width: 460px;
            width: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player-card {
            background: var(--box-bg);
            border: var(--hand-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--doodle-shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .photo-container {
            width: 100%;
            height: 280px;
            border: var(--hand-border);
            border-radius: 16px;
            overflow: hidden;
            background-color: #FAF6F0;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-container {
            text-align: center;
            padding: 5px 0;
        }

        .song-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            display: inline-block;
            border-bottom: 2px dashed var(--text-dark);
            padding-bottom: 2px;
        }

        .lyrics-box {
            font-family: 'Patrick Hand', cursive;
            font-size: 22px;
            line-height: 1.5;
            color: #333333;
            background: #FDFDFD;
            border: 2px dashed #CCCCCC;
            padding: 15px;
            border-radius: 12px;
            min-height: 110px;
            white-space: pre-line;
        }

        /* CONTROLES DOODLE */
        .controls-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modern-select {
            width: 100%;
            font-family: 'Fredoka', sans-serif;
            background: var(--box-bg);
            color: var(--text-dark);
            border: var(--hand-border);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            text-align: center;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .btn-nav {
            flex: 1;
            font-family: 'Fredoka', sans-serif;
            background: var(--box-bg);
            color: var(--text-dark);
            border: var(--hand-border);
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #1A1A1A;
            transition: all 0.1s;
        }

        .btn-nav:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #1A1A1A;
        }

        /* WIDGET SPOTIFY */
        .spotify-container {
            width: 100%;
            border: var(--hand-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--doodle-shadow);
            background: #000;
        }

        .spotify-container iframe { display: block; }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 999;
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    
    <!-- PRESENTACIÓN DOODLE -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <div class="welcome-poem">Todos los días todo el día me puedo sentir bien
Todos los días todo el día me puedo sentir terrible
Todos los días todo el día te extraño
Todos los días todo el día eres tú</div>
            <div class="welcome-birthday">Felices 22 años de vida 🐾</div>
            <div>
                <button class="btn-open" onclick="startExperience()">Abrir Regalo ✨</button>
            </div>
        </div>
    </div>

    <!-- CONTENIDO WEB -->
    <main id="main-content">
        <div class="player-card">
            <div class="photo-container"><img id="song-img" src="" alt="Momento"></div>
            <div class="info-container">
                <div class="song-title" id="song-title">Cargando...</div>
                <div class="lyrics-box" id="song-lyrics">Cargando dedicatoria...</div>
            </div>
            <div class="controls-box">
                <select id="song-select" class="modern-select" onchange="changeSong(this.value)"></select>
                <div class="nav-buttons">
                    <button class="btn-nav" onclick="navigate(-1)">Anterior</button>
                    <button class="btn-nav" onclick="navigate(1)">Siguiente</button>
                </div>
            </div>
        </div>

        <div class="spotify-container">
            <iframe style="border-radius:12px" src="https://spotify.com" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </main>

    <!-- Importación de tu archivo externo -->
    <script src="playlist.js"></script>
      <script>
        let currentIndex = 0;
        const selectElement = document.getElementById('song-select');
        
        // Cargar menú desplegable desde el archivo JS externo
        playlistData.forEach((song, idx) => {
            let option = document.createElement('option');
            option.value = idx;
            option.textContent = song.title;
            selectElement.appendChild(option);
        });

        function updateSongDisplay(index) {
            currentIndex = index;
            const song = playlistData[index];
            document.getElementById('song-title').textContent = song.title;
            document.getElementById('song-lyrics').textContent = song.lyrics;
            document.getElementById('song-img').src = song.photo;
            document.getElementById('song-select').value = index;
        }

        function changeSong(index) { updateSongDisplay(parseInt(index)); }
        
        function navigate(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < playlistData.length) {
                updateSongDisplay(newIndex);
            }
        }

        function startExperience() {
            document.getElementById('welcome-screen').classList.add('hidden');
            initConfetti();
        }

        // CONFETI ESTILO DOODLE (Colores Peanuts)
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confetti = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initConfetti() {
            const colors = ['#FFDE4D', '#FF6B6B', '#1A1A1A', '#6FA8DC', '#FFFFFF'];
            for (let i = 0; i < 60; i++) {
                confetti.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height, r: Math.random() * 5 + 3, d: Math.random() * canvas.height, color: colors[Math.floor(Math.random() * colors.length)], tilt: Math.random() * 10 - 5, tiltAngleIncremental: Math.random() * 0.05, tiltAngle: 0 });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            confetti.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleIncremental; p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2; p.x += Math.sin(p.tiltAngle); p.tilt = Math.sin(p.tiltAngle - index / 3) * 10;
                if (p.y <= canvas.height) active = true;
                ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x + p.tilt + p.r / 2, p.y); ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2); ctx.stroke();
            });
            if (active) requestAnimationFrame(animateConfetti);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        updateSongDisplay(0);
    </script>
</body>
</html>
