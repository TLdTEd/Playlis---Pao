<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22</title>
    <style>
        :root {
            --bg-main: #121212; /* Negro Spotify */
            --bg-card: #181818; /* Gris oscuro paneles */
            --accent: #1DB954;  /* Verde oficial */
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
            --shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* PANTALLA ENTRADA */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-main);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.6s ease, visibility 0.6s; padding: 20px;
        }

        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .welcome-card {
            background: var(--bg-card); padding: 40px; border-radius: 12px;
            box-shadow: var(--shadow); max-width: 400px; width: 100%; text-align: center;
        }

        .welcome-title { font-size: 64px; font-weight: 800; margin-bottom: 5px; }
        .welcome-subtitle { font-size: 14px; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 30px; text-transform: uppercase; }

        .btn-open {
            background-color: var(--accent); color: #000000; border: none; padding: 14px 32px;
            font-size: 14px; font-weight: 700; border-radius: 50px; cursor: pointer; transition: transform 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-open:hover { transform: scale(1.05); }

        /* REPRODUCTOR */
        #main-content { max-width: 480px; width: 100%; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .player-card { background: var(--bg-card); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 20px; }
        
        .photo-container { width: 100%; height: 300px; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
        .photo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .song-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; text-align: left; }
        
        .lyrics-box {
            margin-top: 15px; font-size: 15px; line-height: 1.6; color: var(--text-muted);
            background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; min-height: 120px; white-space: pre-line;
        }

        .controls-box { display: flex; flex-direction: column; gap: 12px; }
        .modern-select { width: 100%; background: #282828; color: var(--text-main); border: none; padding: 10px 15px; border-radius: 4px; font-size: 14px; outline: none; cursor: pointer; }
        
        .nav-buttons { display: flex; justify-content: space-between; gap: 15px; }
        .btn-nav { flex: 1; background: transparent; color: var(--text-main); border: 1px solid var(--text-muted); padding: 10px; font-size: 14px; border-radius: 50px; cursor: pointer; transition: all 0.2s; }
        .btn-nav:hover { border-color: var(--text-main); background: rgba(255,255,255,0.05); }
        
        .spotify-container { width: 100%; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1 class="welcome-title">22</h1>
            <p class="welcome-subtitle">Tus 22 años en canciones ✨</p>
            <button class="btn-open" onclick="startExperience()">Escuchar regalo</button>
        </div>
    </div>

    <main id="main-content">
        <div class="player-card">
            <div class="photo-container"><img id="song-img" src="" alt="Momento"></div>
            <div class="info-container">
                <div class="song-title" id="song-title">Cargando...</div>
                <div class="lyrics-box" id="song-lyrics">Cargando letras...</div>
            </div>
            <div class="controls-box">
                <select id="song-select" class="modern-select" onchange="changeSong(this.value)"></select>
                <div class="nav-buttons">
                    <button class="btn-nav" onclick="navigate(-1)">Anterior</button>
                    <button class="btn-nav" onclick="navigate(1)">Siguiente</button>
                </div>
            </div>
        </div>

        <div class="spotify-container">
            <iframe style="border-radius:12px" src="https://spotify.com" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </main>

    <!-- Importación del archivo externo con las letras completas -->
    <script src="playlist.js"></script>
      <script>
        let currentIndex = 0;
        const selectElement = document.getElementById('song-select');
        
        // Rellenar menú con los datos importados
        playlistData.forEach((song, idx) => {
            let option = document.createElement('option');
            option.value = idx;
            option.textContent = song.title;
            selectElement.appendChild(option);
        });

        function updateSongDisplay(index) {
            currentIndex = index;
            const song = playlistData[index];
            document.getElementById('song-title').textContent = song.title;
            document.getElementById('song-lyrics').textContent = song.lyrics;
            document.getElementById('song-img').src = song.photo;
            document.getElementById('song-select').value = index;
        }

        function changeSong(index) { updateSongDisplay(parseInt(index)); }
        
        function navigate(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < playlistData.length) {
                updateSongDisplay(newIndex);
            }
        }

        function startExperience() {
            document.getElementById('welcome-screen').classList.add('hidden');
            initConfetti();
        }

        // CONTROL ANIMACIÓN CONFETI
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confetti = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initConfetti() {
            const colors = ['#1DB954', '#FFFFFF', '#535353', '#212121'];
            for (let i = 0; i < 60; i++) {
                confetti.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height, r: Math.random() * 4 + 2, d: Math.random() * canvas.height, color: colors[Math.floor(Math.random() * colors.length)], tilt: Math.random() * 10 - 5, tiltAngleIncremental: Math.random() * 0.05, tiltAngle: 0 });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            confetti.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleIncremental; p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2; p.x += Math.sin(p.tiltAngle); p.tilt = Math.sin(p.tiltAngle - index / 3) * 10;
                if (p.y <= canvas.height) active = true;
                ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x + p.tilt + p.r / 2, p.y); ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2); ctx.stroke();
            });
            if (active) requestAnimationFrame(animateConfetti);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Cargar primera canción al abrir
        updateSongDisplay(0);
    </script>
</body>
</html>
